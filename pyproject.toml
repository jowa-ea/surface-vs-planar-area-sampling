[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain-inflation"
version = "1.0.0"
description = "Surface versus planar area of land cover: global inflation metrics and a surface-area sampling design"
readme = "README.md"
requires-python = ">=3.13"
# Pinned versions of the published run: requirements.txt / environment.yml.
# GDAL (with the gdalwarp command-line tool) is best installed with conda.
dependencies = [
    "GDAL",
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "PyYAML",
    "requests",
    "pystac-client",
    "planetary-computer",
]

[tool.setuptools.packages.find]
include = ["terrain_inflation*"]
