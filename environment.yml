# conda env create -f environment.yml && conda activate terrain-inflation
name: terrain-inflation
channels:
  - conda-forge
dependencies:
  - python=3.13
  - gdal=3.12.3
  - numpy=2.4.6
  - pandas=2.2.3
  - geopandas=1.1.4
  - shapely=2.1.2
  - pyproj=3.7.2
  - pyyaml=6.0.3
  - requests=2.32.3
  - pip
  - pip:
      - pystac-client==0.9.0
      - planetary-computer==1.0.0
